site_name: billzi2016.github.io Maintenance Docs
site_description: Maintenance documentation for the Astro portfolio site.
site_url: https://billzi2016.github.io/docs/
repo_url: https://github.com/billzi2016/billzi2016.github.io
repo_name: billzi2016.github.io

docs_dir: docs
site_dir: ../public/docs
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: cyan

extra_css:
  - styles/extra.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 简体中文
          build: true
          default: true
          site_name: billzi2016.github.io 维护文档
        - locale: en
          name: English
          build: true
          site_name: billzi2016.github.io Maintenance Docs
          nav_translations:
            首页: Home
            维护文档: Maintenance Docs
            Agent 指南: Agent Guide
            维护方案: Maintenance Plan
            Astro 迁移方案: Astro Migration Plan
            工程原则: Engineering Principles
            模块地图: Module Map
            PRD: PRDs
            MkDocs PRD: MkDocs PRD
            GitHub Actions PRD: GitHub Actions PRD

nav:
  - 首页: index.md
  - 维护文档:
      - Agent 指南: AGENTS.md
      - 维护方案: maintenance-plan.md
      - Astro 迁移方案: astro-migration-plan.md
      - 工程原则: engineering-principles.md
      - 模块地图: module-map.md
  - PRD:
      - MkDocs PRD: mkdocs_prd.md
      - GitHub Actions PRD: github_action_prd.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
    not_found: ignore
    unrecognized_links: ignore
    anchors: ignore
